  - id: typecheck
    claim_type: typecheck_clean
    action: block
    claims:
      - '(?i)\btypecheck\s+is\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>clean)\b'
      - '(?i)\S+\s+(?P<pred>reports?\s+no\s+type\s+errors)\b'
      - '(?i)\bmypy\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>pass(?:es|ed|ing)?)\s+with\s+zero\s+errors\b'
      - '(?i)\btype\s+checking\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>succeeds?)\b'
      - '(?i)\bno\s+type\s+errors\s+(?P<pred>remain)\b'
      - '(?i)\btsc\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>reports?\s+zero\s+problems)\b'
      - '(?i)\btypecheck\s*:\s*(?P<pred>clean)\b'
      - '(?i)(?P<pred>✅)\s*types?\b'
      - '(?i)\bstatic\s+types\s+all\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>check\s+out)\b'
      - '(?i)\btype\s+checking\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>pass(?:es|ed|ing)?)\s+without\s+warnings\b'
      - '(?i)\ball\s+type\s+errors\s+are\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>resolved)\b'
      - '(?i)\bno\s+type\s+(?P<pred>errors?)\b'
      - '(?i)\b0\s+type\s+(?P<pred>errors?)\b'
      - '(?i)\b(?P<pred>\d+%\s+typed)\b'
      - '(?i)\btype.?check(?:s|ing)?\s+(?P<pred>clean(?:ly)?)\b'
      - '(?i)\btype.?check(?:s|ing)?\b[^\n:]{0,20}?:\s*(?P<pred>clean)\b'
      - '(?i)\btypes?\s+check(?:s|ing)?\s+(?P<pred>clean(?:ly)?)\b'
      - '(?i)\btypes?\s+(?P<pred>ok)\b'
      - '(?i)\bno\s+(?P<pred>diagnostics?)\b'
      - '(?i)\b(?P<pred>passes?)\s+mypy\b'
      - '(?i)\b(?:mypy|pyright|basedpyright|tsc|vue-tsc|dmypy|flow|pyre|sorbet|clang|the\s+compiler|the\s+type\s+checker)\b[^\n]{0,55}?\b(?P<pred>passe?s|passed|passing|clean|happy|zero\s+errors?|reports?\s+zero\s+(?:errors?|problems?)|no\s+errors?|0\s+errors?|success:?\s*no\s+issues?\s+found|no\s+longer\s+(?:flags?\s+anything|complains?))\b'
      - '(?i)(?=[^.!?]{0,32}\btype)\b(?:tests?|lint(?:ing)?|types?|typecheck(?:ing)?)\b(?:\s*,\s*(?:tests?|lint(?:ing)?|types?|typecheck(?:ing)?)\b)*(?:\s*,?\s*and\s+(?:tests?|lint(?:ing)?|types?|typecheck(?:ing)?)\b)?\s+(?:(?:all|still|already|now|finally|consistently|reliably|also)\s+){0,2}(?P<pred>pass(?:es|ed|ing)?)\b'
      # Status/count wording (spec item A): "strict mode passes clean", "No issues found!",
      # a clause-final "Success" banner (ReScript's "Success — 0 errors", the dash split
      # leaves "Success" ending the first clause), "type checking ... no errors" spanning a
      # parenthetical aside, "zero errors, zero warnings", table/checkmark rows.
      - '(?i)\bstrict\s+mode\s+(?P<pred>pass(?:es|ed|ing)?\s+clean|clean)\b'
      - '(?i)\b(?P<pred>no\s+issues?\s+found)\b'
      - '(?i)\bSuccess\b\s*$'
      - '(?i)\btype\s*.?check(?:s|ing)?\b[^\n]{0,40}?\b(?P<pred>no\s+errors?)\b'
      - '(?i)^\s*:\s*(?P<pred>no\s+errors?)\s*$'
      - '(?i)\b(?P<pred>zero\s+errors?\s*,\s*zero\s+warnings?)\b'
      - '(?i)\|\s*(?:types?|typecheck(?:ing)?)\s*\|[^|\n]*?(?P<pred>✅[^|\n]*|clean[^|\n]*|no\s+errors?[^|\n]*)\|'
      - '(?i)\b(?P<pred>✅|✔|✓)\s*types?\b'
      - '(?i)\btypes?\s*(?P<pred>✅|✔|✓)'
    keywords: [type, mypy, pyright, tsc, compil, diagnostic, issue, success, strict]
    evidence:
      commands:
        - "mypy"
        - "dmypy run"
        - "pyright"
        - "basedpyright"
        - "tsc"
        - "vue-tsc"
        - "npm run typecheck"
        - "npm run type-check"
        - "pnpm typecheck"
        - "pnpm run typecheck"
        - "yarn typecheck"
        - "cargo check"
        - "go vet"
        - "go build"
        - "make typecheck"
      exclude_args: ["--help", "--version", "--watch", "-w"]
      partial_args: []
      fail_output:
        - "(?m)^Found [1-9]\\d* errors?"
        - 'error TS\d+'
        - ": error:"
        - '\b[1-9]\d* errors?\b'
        - "(?m)^error(?:\\[E\\d+\\])?:"
      success_output:
        - "Success: no issues found"
        - "Found 0 errors"
        - '\b0 errors\b'
        - "Finished "
      empty_output: []
    relevant_files: *relevant_files_all
    ignore_files: *ignore_files_common
    exempt_if_only_edited: []
    suggest: null

  - id: deploy
    claim_type: deployed
    action: block
    claims:
      - '(?i)\b(?P<pred>deployed)\s+to\s+production\b'
      - '(?i)\bthe\s+release\s+is\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>live)\b'
      - '(?i)\b(?P<pred>shipped)\s+the\s+new\s+version\b'
      - '(?i)\b(?P<pred>shipped)\s+v?\d[\w.]*\b'
      - '(?i)\S+\s+(?P<pred>deployed\s+successfully)\b'
      - '(?i)\b(?P<pred>published)\s+the\s+new\s+release\b'
      - '(?i)\b(?P<pred>rolled\s+out)\s+to\s+production\b'
      - '(?i)\bthe\s+app\s+is\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>live)\s+now\b'
      - '(?i)\b(?P<pred>pushed)\s+the\s+release\s+out\b'
      - '(?i)\bdeployment\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>succeeded)\b'
      - '(?i)\bdeploy\s*:\s*(?P<pred>live|production|prod|staging)\b'
      - '(?i)(?P<pred>✅)\s*deployed\b'
      - '(?i)^(?P<pred>deployed|shipped|released|published|pushed|rolled\s+out)\b(?!\s+(?:back|for|until))'
      - '(?i)\b(?P<pred>deployed|shipped|published)\s+to\s+\w+\b'
      - '(?i)\bis\s+(?P<pred>deployed)\s+to\b'
      - '(?i)\bis\s+(?P<pred>rolled\s+out)\b'
      - '(?i)\b(?P<pred>released)\s+v?\d[\w.]*\b'
      - '(?i)\b\w+\s+(?:is|are)\s+(?P<pred>live)\b'
      - '(?i)\b(?P<pred>pushed)\s+the\s+(?:built\s+)?(?:image|release|build|artifact|artefact|package)\b'
      # A verb + object-noun-phrase + "to <destination>", allowing the object between the
      # verb and "to" (spec item A: "shipped the fix to production", "shipped the update to
      # the App Store" -- the existing pattern above requires "to" right after the verb).
      - '(?i)\b(?P<pred>deployed|shipped|published)\b[^.!?\n]{0,30}?\bto\s+(?:the\s+)?[\w.]+(?:\s+\w+)?\b'
      - '(?i)\b(?P<pred>rolled)\s+(?:\w+\s+){1,3}out\b'
      - '(?i)\bpromoted\s+(?:it|the\s+\w+(?:\s+\w+)?)\b[^.!?\n]{0,30}?\bto\s+(?:the\s+)?(?:full\s+)?(?P<pred>production|prod)\b'
      - '(?i)\bthe\s+(?:image|package|artifact|artefact|binary)\s+is\s+(?:now\s+)?(?P<pred>in\s+the\s+registry|on\s+(?:PyPI|npm|crates\.io))\b'
      - '(?i)\b(?:new\s+version|the\s+release)\s+(?:is\s+)?(?P<pred>serving\s+\d+%?\s+of\s+traffic)\b'
      - '(?i)\bmigration\s+(?P<pred>applied)\s+to\s+(?:production|prod)\b'
    keywords: [deploy, ship, live, release, publish, push, roll, promot, registry, pypi, traffic, migration]
    evidence:
      commands:
        - "vercel deploy"
        - "vercel --prod"
        - "netlify deploy"
        - "fly deploy"
        - "flyctl deploy"
        - "kubectl apply"
        - "helm upgrade"
        - "helm install"
        - "terraform apply"
        - "pulumi up"
        - "docker push"
        - "npm publish"
        - "pnpm publish"
        - "cargo publish"
        - "twine upload"
        - "uv publish"
        - "gcloud run deploy"
        - "gcloud app deploy"
        - "firebase deploy"
        - "wrangler deploy"
        - "serverless deploy"
        - "sls deploy"
        - "cdk deploy"
        - "railway up"
        - "git push heroku"
        - "make deploy"
      exclude_args:
        [
          "--dry-run",
          "--dry-run=client",
          "--dry-run=server",
          "--help",
          "--version",
        ]
      partial_args: []
      fail_output:
        - "(?i)deployment failed"
        - "(?m)^Error: "
        - "npm ERR!"
        - '(?i)\bdenied\b'
        - "(?i)failed to (?:deploy|push|publish|apply)"
      success_output:
        - '(?i)\bdeployed\b'
        - "(?i)deployment (?:complete|successful|succeeded)"
        - "Apply complete!"
        - "(?m)\\b(?:configured|created|unchanged)$"
        - "digest: sha256:"
        - "(?m)^\\+ \\S+@\\d"
        - "(?i)has been upgraded"
        - "(?i)successfully (?:deployed|published|pushed)"
      empty_output: []
    relevant_files: *relevant_files_all
    ignore_files: *ignore_files_common
    exempt_if_only_edited: []
    suggest: null

