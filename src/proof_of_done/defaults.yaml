# Built-in configuration for proof-of-done, shipped inside the package.
#
# Layer order (lowest to highest precedence): this file < user config
# (${XDG_CONFIG_HOME:-~/.config}/proof-of-done/config.yaml) < project config
# (<root>/.proof-of-done.yaml) < the file named by PROOF_OF_DONE_CONFIG < environment
# variables. Project rules merge into these by `id`, field by field; a rule's `evidence`
# mapping merges by key; every other list replaces the lower layer's list wholesale.
#
# Prefix lists (`evidence.commands`, `execution_commands`, `read_only_commands`,
# `edits.bash_writes`, `edits.formatters`, `edits.tree_commands`) are written as plain
# strings and split into argv-token prefixes with `shlex.split` when the config is loaded.
# A trailing `*` token matches any suffix (`npm run test:*` matches `npm run test:unit`).
#
# See docs/config.md for the full reference.

version: 1
enabled: true
mode: block
max_blocks_per_turn: 2
check_subagents: true
subagent_skip_types: [Explore, Plan]
subagent_calls_are_edits: true
skip_token: "#skip-proof"
max_transcript_mb: 200

edits:
  tools: [Edit, Write, MultiEdit, NotebookEdit]
  subagent_tools: [Agent, Task]
  # Bash commands whose target path shell.py resolves as an edit. The exact source/dest
  # extraction for each of these (mv's two paths, dd's of=, sed -i's optional suffix, ...)
  # is implemented in shell.py; this list only says which programs are write operations.
  bash_writes:
    - "sed -i"
    - "perl -pi"
    - "perl -i"
    - "tee"
    - "tee -a"
    - "mv"
    - "cp"
    - "rm"
    - "touch"
    - "ln"
    - "truncate"
    - "dd"
    - "rsync"
    - "install"
    - "patch"
    - "git apply"
    - "git mv"
    - "git rm"
  # Formatters/fixers: touch their path arguments (or the whole project when none given).
  formatters:
    - "ruff format"
    - "ruff check --fix"
    - "black"
    - "isort"
    - "autopep8 -i"
    - "prettier --write"
    - "prettier -w"
    - "eslint --fix"
    - "cargo fmt"
    - "rustfmt"
    - "gofmt -w"
    - "go fmt"
    - "goimports -w"
  # Whole-tree events: touch every file in the project. "git stash" alone also matches
  # "git stash list"/"git stash show" by prefix; shell.py excludes those two read-only
  # subcommands from whole-tree treatment.
  tree_commands:
    - "git checkout"
    - "git switch"
    - "git restore"
    - "git pull"
    - "git merge"
    - "git rebase"
    - "git reset --hard"
    - "git stash"
    - "git cherry-pick"
    - "git revert"
    - "git am"
    - "git clean"
    - "tar -x"
    - "tar x"
    - "unzip"
  agent_trace_tools: [Edit, Write, MultiEdit, NotebookEdit, apply_patch, write_file, edit_file]

execution_commands:
  - "curl"
  - "wget"
  - "http"
  - "https"
  - "python *.py"
  - "python -m *"
  - "node *.js"
  - "node *.mjs"
  - "node *.cjs"
  - "node *.ts"
  - "deno run"
  - "bun run"
  - "go run"
  - "cargo run"
  - "./*"
  - "bash *.sh"
  - "sh *.sh"
  - "docker run"
  - "docker compose up"
  - "docker-compose up"
  - "make *"
  - "npm run *"
  - "pnpm run *"
  - "npm start"
  - "uvicorn"
  - "flask run"

read_only_commands:
  - "cat"
  - "less"
  - "more"
  - "head"
  - "tail"
  - "ls"
  - "tree"
  - "find"
  - "grep"
  - "egrep"
  - "rg"
  - "ag"
  - "fd"
  - "wc"
  - "echo"
  - "printf"
  - "pwd"
  - "which"
  - "type"
  - "file"
  - "stat"
  - "du"
  - "sort"
  - "uniq"
  - "cut"
  - "jq"
  - "awk"
  - "sed -n"
  - "date"
  - "true"
  - "false"
  - "sleep"
  - "test"
  - "git status"
  - "git diff"
  - "git log"
  - "git show"
  - "git branch"

# Claim patterns allow one neutral adverb between subject and predicate ("tests still pass",
# "the bug is now fixed") through the slot (?:(?:still|already|now|finally|consistently|
# reliably|also)\s+)?; compound lists ("tests and lint all still pass") allow up to two of
# those words or "all". claims.py's _NEUTRAL_ADVERBS must list the same words so the negation
# window skips them ("Not all tests still pass" stays negated).
rules:
  - id: tests
    claim_type: tests_passed
    action: block
    claims:
      - '(?i)\ball\s+(?:\d+\s+)?tests?\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>pass(?:es|ed|ing)?)\b'
      - '(?i)\b(?:tests?|suite)\s+(?:are|is)\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>green)\b'
      - '(?i)\b(?:the\s+)?(?:full\s+)?test\s+suite\s+(?:is\s+)?(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>(?:fully\s+)?green|pass(?:es|ed|ing)?(?:\s+now)?)\b'
      - '(?i)\b(?:the\s+)?suite\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>pass(?:es|ed|ing)?)\b'
      - '(?i)\ball\s+specs\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>pass(?:es|ed|ing)?)\b'
      - '(?i)\b\d+\s*/\s*\d+\s+tests\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>passing)\b'
      - '(?i)\btests?\s*:\s*(?P<pred>✅|✔)'
      - '(?i)\btests?\s*:\s*(?P<pred>\d[\d,]*\s+passed)\b'
      - '(?i)(?P<pred>✅)\s*tests?\b'
      - '(?i)\|\s*tests?\s*\|[^|\n]*?(?P<pred>✅[^|\n]*|passing[^|\n]*)\|'
      - '(?i)\bpytest\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>pass(?:es|ed|ing)?)\b'
      - '(?i)\btests?\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>pass(?:es|ed|ing)?)\b'
      - '(?i)\btests?\s+(?:\w+\s+){1,2}(?P<pred>pass(?:es|ed|ing)?)\b'
      - '(?i)^\s*(?P<pred>\d[\d,]*\s+passed)\b'
      - '(?i)\b(?:green|clean)\b[^\n]{0,40}?\b(?P<pred>\d[\d,]*\s+passed)\b'
      - '(?i)·+\s+is\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>green)\b'
      - '(?i)\b(?:tests?|suite|specs?|pytest|jest|vitest|mocha|go\s+test|cargo\s+test|rspec|dotnet\s+test)\s+(?:are\s+|is\s+)?(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>green)\b'
      - '(?i)\b(?:tests?|suite)\s+(?:has|have)\s+been\s+(?P<pred>stable|green|passing)\b'
      - '(?i)\bis\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>passing)\b'
      - '(?i)\b(?:tests?|suite)\s+(?P<pred>ok)\b'
      - '(?i)\b(?P<pred>green)\s+(?:on\s+every|across\s+(?:the\s+board|every))\b'
      - '(?i)\bno\s+(?:more\s+)?(?:failing|broken|red)\s+(?P<pred>tests?)\b'
      - '(?i)\btests?\b[^\n]{0,60}?\b(?P<pred>ok\s+for\s+all)\b'
      - '(?i)\b\d[\d,]*\s+tests?\s*,\s*\d[\d,]*\s+(?P<pred>assertions?)\b'
      - '(?i)(?=[^.!?]{0,32}\btests?\b)\b(?:tests?|lint(?:ing)?|types?|typecheck(?:ing)?)\b(?:\s*,\s*(?:tests?|lint(?:ing)?|types?|typecheck(?:ing)?)\b)*(?:\s*,?\s*and\s+(?:tests?|lint(?:ing)?|types?|typecheck(?:ing)?)\b)?\s+(?:(?:all|still|already|now|finally|consistently|reliably|also)\s+){0,2}(?P<pred>pass(?:es|ed|ing)?)\b'
      # Count summaries (spec item A): "<N> passed[, <M> failed/total]" wherever it sits in
      # the clause (after a colon, an arrow, a tool name -- the clause need not start with
      # it), a nonzero head so "0 passed" (a failure) never counts.
      - '(?i)\b(?P<pred>[1-9][\d,]*\s+passed(?:\s*,\s*\d[\d,]*\s+(?:failed|total))?)\b'
      - '(?i)\b(?P<pred>[1-9][\d,]*\s+(?:examples?|tests?|specs?)\s*,\s*0\s+failures?)\b'
      - '(?i)\bFailed\s*:\s*0\s*,\s*(?P<pred>Passed\s*:\s*\d[\d,]*)\b'
      - '\b(?P<pred>PASS)\b'
      - '(?i)\b(?P<pred>✅|✔|✓)\s*tests?\b'
      - '(?i)\btests?\s*(?P<pred>✅|✔|✓)'
      # Subject-optional forms ("all 18 pass", "all pass", "all of them came back passing")
      # and a bare "no failures" (item A: "subject optional when the clause names a test tool
      # ... or suite/tests/specs/run").
      - '(?i)\ball\s+\d+\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>pass(?:es|ed|ing)?)\b'
      - '(?i)\ball\s+of\s+them\s+(?:came\s+back\s+)?(?P<pred>pass(?:es|ed|ing))\b'
      - '(?i)(?<!types\s)(?<!lint\s)(?<!tests\s)\ball\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>pass(?:es|ed|ing)?)\b'
      - '(?i)\bno\s+(?P<pred>failures?)\b'
      # Gap-tolerant "suite ... passes" (item B: allow a parenthetical/dash insertion between
      # subject and predicate -- dashes are masked in pairs, so only a comma-delimited aside
      # like "the whole suite, including the new test, passes" needs the gap here).
      - '(?i)\b(?:the\s+)?(?:whole\s+|full\s+)?suite\b[^.!?\n]{0,60}?\b(?P<pred>pass(?:es|ed|ing)?)\b'
      - '(?i)\b(?:added|wrote)\s+(?:and\s+)?(?P<pred>passed)\s+(?:a|the)\s+(?:new\s+|regression\s+)?test\b'
      - '(?i)\b(?:added|wrote)\s+(?:a|the)\s+(?:new\s+|regression\s+)?test\b[^.!?\n]{0,40}?\b(?P<pred>pass(?:es|ed|ing))\b'
    keywords: [test, spec, pass, green, suite, fail]
    evidence:
      commands:
        - "pytest"
        - "python -m pytest"
        - "python -m unittest"
        - "tox"
        - "nox"
        - "hatch test"
        - "npm test"
        - "npm t"
        - "npm run test"
        - "npm run test:*"
        - "pnpm test"
        - "pnpm run test"
        - "pnpm run test:*"
        - "yarn test"
        - "yarn run test"
        - "bun test"
        - "jest"
        - "vitest run"
        - "vitest --run"
        - "mocha"
        - "playwright test"
        - "go test"
        - "cargo test"
        - "cargo nextest run"
        - "make test"
        - "make check"
        - "just test"
      exclude_args:
        [
          "--collect-only",
          "--co",
          "--help",
          "-h",
          "--version",
          "--watch",
          "--watchAll",
          "--no-run",
          "--list",
          "--dry-run",
        ]
      partial_args:
        [
          "-k",
          "--lf",
          "--last-failed",
          "--sw",
          "--stepwise",
          "-run",
          "-t",
          "--testNamePattern",
          "--test-name-pattern",
          "--deselect",
          "--grep",
          "-g",
          "--filter",
        ]
      fail_output:
        - '\b[1-9]\d* (?:failed|failing|errors?)\b'
        - '\bFAILED\b'
        - 'Traceback \(most recent call last\)'
        - "npm ERR!"
        - 'error TS\d+'
        - "panicked at"
        - "(?m)^FAIL\\b"
        - "(?m)^--- FAIL"
        - "test result: FAILED"
      success_output:
        - '\b[1-9]\d* (?:passed|passing)\b'
        - 'test result: ok\.'
        - '(?m)^ok\s+\S+'
        - "(?m)^PASS\\b"
        - "(?m)^OK\\b"
        - "All tests passed"
      empty_output:
        - "collected 0 items"
        - "no tests ran"
        - "No tests found"
        - "No test files found"
        - "Ran 0 tests"
        - '\b0 passing\b'
        - "testing: warning: no tests to run"
        - '\A(?![\s\S]*\b[1-9]\d* passed)[\s\S]*\brunning 0 tests\b'
    relevant_files: &relevant_files_all ["**"]
    ignore_files: &ignore_files_common
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.rst"
      - "**/*.adoc"
      - "docs/**"
      - "LICENSE*"
      - "CHANGELOG*"
      - ".gitignore"
      - ".claude/**"
      - "**/*.log"
      - ".proof-of-done.yaml"
    exempt_if_only_edited: []
    suggest: null

  - id: build
    claim_type: build_passed
    action: block
    claims:
      - '(?i)\bthe\s+build\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>succeed(?:s|ed|ing)?)\b'
      - '(?i)\bbuild\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>pass(?:es|ed|ing)?)\s+cleanly\b'
      - '(?i)\bthe\s+project\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>compiles?)\s+now\b'
      - '(?i)\b(?P<pred>compiles?|compiled|compiling)\s+(?:cleanly|without\s+(?:errors?|warnings?))\b'
      - '(?i)\b(?P<pred>building)\s+without\s+errors\b'
      - '(?i)\bbuild(?:.?s)?\s+(?:is\s+)?(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>green)\b'
      - '(?i)\S+\s+(?P<pred>(?:build|builds|built|building)\s+successfully)\b'
      - '(?i)\bthe\s+build\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>completes?)\s+without\s+errors\b'
      - '(?i)\bcompilation\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>succeeds?)\s+with\s+no\s+warnings\b'
      - '(?i)\bbuild\s*:\s*(?P<pred>passing)\b'
      - '(?i)(?P<pred>✅)\s*build\b'
      - '(?i)\bthe\s+build\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?finished\s+(?P<pred>successfully)\b'
      - '(?i)\bbuild\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?completed\b.{0,30}?\b(?P<pred>succeeded)\b'
      - '(?i)\bbuild\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>succeed(?:s|ed|ing)?|pass(?:es|ed|ing)?|is\s+green|ok)\b'
      - '(?i)\bbuilds?\s+(?P<pred>without\s+errors|cleanly)\b'
      - '(?i)\bcompiles?\s+(?P<pred>without\s+errors)\b'
      - '(?i)\b(?:the\s+(?:\w+\s+){0,2}\w+|it)\s+(?P<pred>builds?|compiles?)\b(?=\s*(?:now|again|cleanly|clean|fine|ok\b|,|\.|!|$))'
      - '(?i)\bbuilds?\b[^\n]{0,40}?\b(?P<pred>no\s+(?:more\s+)?errors?|0\s+errors?|zero\s+errors?)\b'
      - '(?i)\b(?P<pred>compiling\s+succeeded|compilation\s+succeeded|compiled\s+without\s+incident|compiled\s+successfully)\b'
      - '(?i)\bthe\s+(?:\w+\s+)?build\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>completes?|finishes?)\b'
      - '(?i)\b(?:no|zero)\s+compile\s+(?P<pred>errors?)\b'
      - '(?i)\b(?:0|no|zero)\s+build\s+(?P<pred>errors?|failures?)\b'
      - '(?i)\b(?:binary|artefact|artifact|bundle|image|package|target|app|project)\s+(?:is\s+)?(?P<pred>built)\b'
      - '(?i)\b\d[\d,]*\s*/\s*\d[\d,]*\s+targets?\s+(?P<pred>built)\b'
      - '(?i)(?=[^.!?]{0,32}\bbuild\b)\b(?:builds?|lint(?:ing)?|types?|typecheck(?:ing)?)\b(?:\s*,\s*(?:builds?|lint(?:ing)?|types?|typecheck(?:ing)?)\b)*(?:\s*,?\s*and\s+(?:builds?|lint(?:ing)?|types?|typecheck(?:ing)?)\b)?\s+(?:(?:all|still|already|now|finally|consistently|reliably|also)\s+){0,2}(?P<pred>pass(?:es|ed|ing)?)\b'
      # Cargo's fixed success banner ("Finished dev [unoptimized + debuginfo] target(s) in
      # 6.03s", "Finished release [optimized] target(s)") and a bare "build stage passes".
      - '(?i)\bFinished\s+(?:dev|release|test|bench)\b[^\n]{0,10}?(?:\[[^\]\n]*\]\s*)?(?P<pred>target)\b'
      - '(?i)\bbuild\s+(?:stage|step|job|phase)\s+(?P<pred>pass(?:es|ed|ing)?)\b'
      - '(?i)\bbuilds?\b[^.!?\n]{0,40}?\b(?P<pred>zero\s+errors?|0\s+errors?)\b'
      - '(?i)\b(?P<pred>✅|✔|✓)\s*build\b'
      - '(?i)\bbuild\s*(?P<pred>✅|✔|✓)'
    keywords: [build, compil, built]
    evidence:
      commands:
        - "npm run build"
        - "pnpm build"
        - "pnpm run build"
        - "yarn build"
        - "yarn run build"
        - "bun run build"
        - "vite build"
        - "next build"
        - "tsc --build"
        - "tsc -b"
        - "webpack"
        - "go build"
        - "cargo build"
        - "make build"
        - "make all"
        - "python -m build"
        - "uv build"
        - "hatch build"
        - "poetry build"
        - "docker build"
        - "docker buildx build"
      exclude_args: ["--help", "--version", "--dry-run", "--watch"]
      partial_args: []
      fail_output:
        - '(?i)\bbuild failed\b'
        - "Failed to compile"
        - 'error TS\d+'
        - "(?m)^error(?:\\[E\\d+\\])?:"
        - "npm ERR!"
        - "ELIFECYCLE"
        - "ERROR in "
        - 'Traceback \(most recent call last\)'
      success_output:
        - '(?i)\bbuild (?:succeeded|successful|complete|completed)\b'
        - "(?i)compiled successfully"
        - "Finished "
        - "✓ built in"
        - "Successfully built"
      empty_output: []
    relevant_files: *relevant_files_all
    ignore_files: *ignore_files_common
    exempt_if_only_edited: []
    suggest: null

  - id: lint
    claim_type: lint_clean
    action: block
    claims:
      - '(?i)\blint\s+is\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>clean)\b'
      - '(?i)\S+\s+(?P<pred>reports?\s+no\s+(?:issues?|problems?))\b'
      - '(?i)\bruff\s+is\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>clean)\b'
      - '(?i)\b(?:eslint|flake8|pylint|biome|black|prettier)\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>pass(?:es|ed|ing)?)\b'
      - '(?i)\bno\s+lint\s+(?P<pred>errors?)\s+remain\b'
      - '(?i)\bthe\s+linter\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>pass(?:es|ed|ing)?)\s+with\s+no\s+warnings\b'
      - '(?i)\bformatting\s+and\s+lint\s+both\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>pass(?:es|ed|ing)?)\b'
      - '(?i)\blint(?:ing)?\b[^\n:]{0,20}?:\s*(?P<pred>clean)\b'
      - '(?i)(?P<pred>✅)\s*lint\b'
      - '(?i)\bclippy\s+is\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>happy)\b'
      - '(?i)\blint\s+checks?\s+(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>pass(?:es|ed|ing)?)\s+without\s+errors\b'
      - '(?i)\bzero\s+lint\s+(?P<pred>problems?)\b'
      - '(?i)lint[^\n]{0,40}?\bno\s+(?:more\s+)?(?:new\s+)?(?P<pred>warnings?)\b'
      - '(?i)\bwarnings?\s*:\s*(?P<pred>none|0|no)\b'
      - '(?i)\bformatting\s+is\s+(?P<pred>clean)\b'
      - '(?i)\bno\s+(?P<pred>violations?)\b'
      - '(?i)lint[^\n]{0,40}?\b(?:0|no|zero)\s+(?P<pred>issues?)(?:\s+found)?\b'
      - '(?i)\blinting\s+is\s+(?P<pred>clean)\b'
      - '(?i)\blints?\s+(?P<pred>cleanly)\b'
      - '(?i)\b0\s+lint\s+(?P<pred>issues?|problems?)\b'
      - '(?i)\blint\s+(?P<pred>ok)\b'
      - '(?i)\bthe\s+linter\s+no\s+longer\s+(?P<pred>flags?\s+anything)\b'
      - '(?i)\b(?:ruff|eslint|flake8|pylint|black|biome|prettier|clippy|golangci-lint|stylelint|rubocop|shellcheck|hadolint|markdownlint|yamllint|tflint|swiftlint|ktlint)\b[^\n]{0,40}?\b(?P<pred>passe?s|passed|passing|clean|happy|no\s+findings|nothing(?:\s+(?:to\s+report|flagged|left\s+to\s+flag))?|reports?\s+(?:nothing|a\s+clean\s+pass|zero\s+issues))\b'
      - '(?i)(?=[^.!?]{0,32}\blint(?:ing)?\b)\b(?:tests?|lint(?:ing)?|types?|typecheck(?:ing)?)\b(?:\s*,\s*(?:tests?|lint(?:ing)?|types?|typecheck(?:ing)?)\b)*(?:\s*,?\s*and\s+(?:tests?|lint(?:ing)?|types?|typecheck(?:ing)?)\b)?\s+(?:(?:all|still|already|now|finally|consistently|reliably|also)\s+){0,2}(?P<pred>pass(?:es|ed|ing)?)\b'
      # Status/count wording (spec item A): "lint clean"/"lint-clean", "0 problems"/"0
      # errors, 0 warnings", bare "no warnings[, no errors]", "the linter is happy"/"has
      # nothing to add"/"reports a clean pass", "no offenses detected", "no diff, already
      # formatted", "zero violations", table/checkmark rows.
      - '(?i)\b(?P<pred>lint[\s-]clean)\b'
      - '(?i)\bthe\s+linter\s+is\s+(?P<pred>happy)\b'
      - '(?i)\bthe\s+linter\s+(?P<pred>reports?\s+a\s+clean\s+pass|has\s+nothing\s+to\s+add)\b'
      - '(?i)\b(?P<pred>0\s+problems?)\b'
      - '(?i)\b(?P<pred>0\s+(?:errors?|warnings?)\s*,\s*0\s+(?:errors?|warnings?))\b'
      - '(?i)\b(?:lint(?:er|ing)?|format(?:ter|ting)?|ruff|eslint|flake8|pylint|black|biome|prettier|clippy|golangci-lint|stylelint|rubocop|shellcheck|hadolint|markdownlint|yamllint|tflint|swiftlint|ktlint)\b[^\n]{0,40}?\bno\s+(?P<pred>warnings?)(?:\s*,\s*no\s+errors?)?\b'
      - '(?i)\bno\s+new\s+(?P<pred>warnings?)(?:\s+introduced)?\b'
      - '(?i)\bno\s+more\s+lint\s+(?P<pred>warnings?)\b'
      - '(?i)\b(?P<pred>zero\s+violations?)\b'
      - '(?i)\bevery\s+file\s+is\s+(?:already\s+)?(?P<pred>formatted\s+correctly)\b'
      - '(?i)\bno\s+diff\s*,\s*(?:already\s+)?(?P<pred>formatted)\b'
      - '(?i)\bno\s+(?P<pred>offen[cs]es?\s+detected)\b'
      - '(?i)\b(?P<pred>nothing\s+to\s+report|nothing\s+left\s+to\s+flag)\b'
      - '(?i)^\s*(?:(?:still|already|now|finally|consistently|reliably|also)\s+)?(?P<pred>clean)\s*[.!]?\s*$'
      - '(?i)\bthe\s+(?:package|repo|repository|codebase|module|project)\s+is\s+(?:fully\s+)?(?P<pred>clean)\s+now\b'
      - '(?i)\b(?P<pred>✅|✔|✓)\s*lint(?:ing)?\b'
      - '(?i)\blint(?:ing)?\s*(?P<pred>✅|✔|✓)'
      - '(?i)\|\s*lint(?:ing)?\s*\|[^|\n]*?(?P<pred>✅[^|\n]*|clean[^|\n]*)\|'
      - '(?i)\b(?P<pred>nothing\s+flagged)\b'
    keywords:
      [
