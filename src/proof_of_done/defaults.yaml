        - "black --check"
        - "eslint"
        - "npm run lint"
        - "pnpm lint"
        - "pnpm run lint"
        - "yarn lint"
        - "yarn run lint"
        - "biome check"
        - "biome lint"
        - "prettier --check"
        - "golangci-lint run"
        - "go vet"
        - "staticcheck"
        - "cargo clippy"
        - "cargo fmt --check"
        - "make lint"
        - "pre-commit run"
        - "shellcheck"
      exclude_args: ["--help", "--version", "--watch"]
      partial_args: []
      fail_output:
        - "(?m)^Found [1-9]\\d* errors?"
        - '\b[1-9]\d* problems?\b'
        - '\b[1-9]\d* (?:errors?|warnings?)\b'
        - "(?m)^(?:warning|error)(?:\\[\\w+\\])?: "
        - "(?m)^\\S+:\\d+:\\d+: [A-Z]+\\d+"
        - "Would reformat"
        - "would reformat"
      success_output:
        - "All checks passed!"
        - '\b0 problems\b'
        - '\b0 issues\b'
        - "(?i)no issues found"
        - 'rated at 10\.00/10'
        - "Finished "
