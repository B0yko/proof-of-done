id: demo-rust-tests-pass
description: 'Demo corpus scenario (rust): tests_passed, supported.'
ecosystem: rust
project_files:
  Cargo.toml: |
    [package]
    name = "demo-app"
    version = "0.1.0"
turns:
- user: Fix the integer overflow in the checksum calculator.
  steps:
  - edit:
      tool: Edit
      path: src/models.rs
      old: old_impl
      new: new_impl
  - bash:
      cmd: cargo test
      exit: 0
      output: 'test result: ok. 27 passed; 0 failed'
  final: Patched the overflow bug. [[tests_passed|All tests pass]].
  labels:
    tests_passed:
      label: supported
root: /work/demo-app
env: {}
start: fresh
