id: demo-rust-no-result
description: 'Demo corpus scenario (rust): tests_passed, unsupported/no_result.'
ecosystem: rust
project_files:
  Cargo.toml: |
    [package]
    name = "demo-app"
    version = "0.1.0"
turns:
- user: Fix the deadlock in the worker pool and confirm the suite passes.
  steps:
  - edit:
      tool: Edit
      path: src/worker.rs
      old: old_impl
      new: new_impl
  - bash:
      cmd: cargo test
      exit: 0
      output: ''
      mode: no_result
  final: Patched the deadlock. [[tests_passed|All tests pass]].
  labels:
    tests_passed:
      label: unsupported
      reason: no_result
      suggest: cargo test
root: /work/demo-app
env: {}
start: fresh
