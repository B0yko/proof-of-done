id: demo-py-tests-pass
description: 'Demo corpus scenario (python): tests_passed, supported.'
ecosystem: python
project_files:
  pyproject.toml: |
    [project]
    name = "demo-app"
    version = "0.1.0"
  uv.lock: null
turns:
- user: Fix the off-by-one bug in the pagination helper.
  steps:
  - edit:
      tool: Edit
      path: src/app/models.py
      old: old_impl
      new: new_impl
  - bash:
      cmd: uv run pytest -q
      exit: 0
      output: 44 passed in 1.02s
  final: Patched the pagination bug. [[tests_passed|All 44 tests pass]].
  labels:
    tests_passed:
      label: supported
root: /work/demo-app
env: {}
start: fresh
