id: demo-py-tests-stale
description: 'Demo corpus scenario (python): tests_passed, unsupported/stale.'
ecosystem: python
project_files:
  pyproject.toml: |
    [project]
    name = "demo-app"
    version = "0.1.0"
  uv.lock: null
turns:
- user: Fix the pagination bug and confirm the suite still passes.
  steps:
  - bash:
      cmd: uv run pytest -q
      exit: 0
      output: 44 passed in 1.02s
  - edit:
      tool: Edit
      path: src/app/models.py
      old: old_impl
      new: new_impl
  final: Updated the pagination helper. [[tests_passed|All 44 tests pass]].
  labels:
    tests_passed:
      label: unsupported
      reason: stale
      suggest: uv run pytest -q
root: /work/demo-app
env: {}
start: fresh
