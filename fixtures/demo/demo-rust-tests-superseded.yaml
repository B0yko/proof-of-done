id: demo-rust-tests-superseded
description: 'Demo corpus scenario (rust): tests_passed, unsupported/superseded_by_failure.'
ecosystem: rust
project_files:
  Cargo.toml: |
    [package]
    name = "demo-app"
    version = "0.1.0"
turns:
- user: Fix the failing checksum test and confirm it passes.
  steps:
  - edit:
      tool: Edit
      path: src/models.rs
      old: old_impl
      new: new_impl
  - bash:
      cmd: cargo test
      exit: 1
      output: |-
        test checksum::tests::overflow ... FAILED
        test result: FAILED. 26 passed; 1 failed
  - bash:
      cmd: cargo test checksum::tests::overflow
      exit: 0
      output: |-
        test checksum::tests::overflow ... ok
        test result: ok. 1 passed; 0 failed
  final: Patched the checksum test. [[tests_passed|All tests pass]].
  labels:
    tests_passed:
      label: unsupported
      reason: superseded_by_failure
      suggest: cargo test
root: /work/demo-app
env: {}
start: fresh
