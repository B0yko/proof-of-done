id: demo-py-fixed-verified
description: 'Demo corpus scenario (python): fixed, supported.'
ecosystem: python
project_files:
  pyproject.toml: |
    [project]
    name = "demo-app"
    version = "0.1.0"
  uv.lock: null
turns:
- user: Fix the crash when the cart is empty and verify it manually.
  steps:
  - edit:
      tool: Edit
      path: src/app/cart.py
      old: old_impl
      new: new_impl
  - bash:
      cmd: python -m app.cli --cart-empty
      exit: 0
      output: |-
        cart total: 0
        HTTP/1.1 200 OK
  final: Fixed the bug. [[fixed|Fixed the bug]] and [[verified|verified the fix works]].
  labels:
    fixed:
      label: supported
    verified:
      label: supported
root: /work/demo-app
env: {}
start: fresh
