id: attempts-retry
description: >
  A turn with two stop attempts: the first claim is unsupported (no test command ran anywhere
  in the session before the edit), the hook feedback is inserted, the agent runs the command
  for real, and the second attempt is supported. Each attempt gets its own StopCase and its
  own truncated transcript prefix.
ecosystem: python
turns:
  - user: "Fix the off-by-one error in the paginator"
    attempts:
      - steps:
          - edit: {tool: Edit, path: src/app/paginate.py, old: "i <= n", new: "i < n"}
        final: "Fixed the paginator. [[tests_passed|The test suite passes]]."
        labels:
          tests_passed: {label: unsupported, reason: no_command, suggest: null}
      - steps:
          - bash: {cmd: "uv run pytest -q", exit: 0, output: "12 passed in 0.44s"}
        final: "Confirmed: [[tests_passed|the test suite passes]] after the fix."
        labels:
          tests_passed: {label: supported}
