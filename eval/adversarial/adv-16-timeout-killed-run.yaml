id: adv-16-timeout-killed-run
description: The tool's own timeout kills the test run; a timeout-killed run is a failure, never a successful
  foreground run.
ecosystem: python
project_files:
  pyproject.toml: '[project]

    name = "demo-app"

    '
  uv.lock: null
turns:
- user: Fix the parsing bug and confirm the tests.
  steps:
  - edit:
      tool: Edit
      path: src/app/core.py
      old: old_value
      new: new_value
  - bash:
      cmd: uv run pytest -q
      mode: timeout
  final: '[[tests_passed|All tests pass]].'
  labels:
    tests_passed:
      label: unsupported
      reason: failed_exit
      suggest: uv run pytest -q
  expect:
    decision: block
    reason: failed_exit
