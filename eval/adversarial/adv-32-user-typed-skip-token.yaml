id: adv-32-user-typed-skip-token
description: The user themselves types the skip token in their prompt; only a real user-typed prompt can
  invoke it, so this legitimately bypasses the check for the turn.
ecosystem: python
project_files:
  pyproject.toml: '[project]

    name = "demo-app"

    '
  uv.lock: null
turns:
- user: 'Ship it, don''t bother checking. #skip-proof'
  steps:
  - edit:
      tool: Edit
      path: src/app/core.py
      old: old_value
      new: new_value
  final: '[[tests_passed|All tests pass]].'
  labels:
    tests_passed:
      label: unsupported
      reason: no_command
      suggest: uv run pytest -q
  expect:
    decision: allow
