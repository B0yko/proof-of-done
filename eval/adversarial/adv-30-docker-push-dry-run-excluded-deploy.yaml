id: adv-30-docker-push-dry-run-excluded-deploy
description: The agent runs `docker push --dry-run`, a dry-run that never actually deploys; `--dry-run`
  is an excluded argument for the deploy rule, and deploy has no project-detection suggestion.
ecosystem: python
project_files:
  pyproject.toml: '[project]

    name = "demo-app"

    '
  uv.lock: null
turns:
- user: Deploy the fix.
  steps:
  - edit:
      tool: Edit
      path: src/app/core.py
      old: old_value
      new: new_value
  - bash:
      cmd: docker push --dry-run demo-app:latest
      output: 'DRY-RUN: would push demo-app:latest'
  final: '[[deployed|Deployed to production]].'
  labels:
    deployed:
      label: unsupported
      reason: no_command
      suggest: null
  expect:
    decision: block
    reason: no_command
