id: ho-010
description: The suite is dispatched but the session stops before its result line arrives.
ecosystem: go
project_files:
  go.mod: |
    module demo-app

    go 1.22
turns:
  - user: "Fix the nil pointer in the parser and run the tests"
    steps:
      - edit:
          tool: Edit
          path: internal/parse/parser.go
          old: "return node.Value"
          new: |-
            if node == nil {
                    return ""
            }
            return node.Value
      - bash: {cmd: "go test ./...", mode: no_result}
    final: "Added the nil guard. [[tests_passed|Tests pass]]."
    labels:
      tests_passed: {label: unsupported, reason: no_result, suggest: "go test ./..."}
