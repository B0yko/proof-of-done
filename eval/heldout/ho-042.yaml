ecosystem: go
project_files:
  go.mod: |
    module demo-app

    go 1.22
turns:
  - user: "Fix the panic on a nil context in the middleware and start the server in the background to poke at it"
    steps:
      - edit:
          tool: Edit
          path: internal/http/middleware.go
          old: "user := ctx.Value(userKey)"
          new: "if ctx == nil {\n\t\tctx = context.Background()\n\t}\n\tuser := ctx.Value(userKey)"
