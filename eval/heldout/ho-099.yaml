id: ho-099
description: A claim-free negation lead-in about panic handling, then a genuine fixed turn.
ecosystem: rust
project_files:
  Cargo.toml: |
    [package]
    name = "demo-app"
    version = "0.4.2"
turns:
  - user: "does the config loader handle a missing file gracefully?"
    final: "No, right now it panics with an unwrap - that needs fixing before this ships."
    labels: {}
  - user: "please fix it"
    steps:
      - edit: {tool: Edit, path: src/config.rs, old: "let text = std::fs::read_to_string(path).unwrap();", new: "let text = std::fs::read_to_string(path).unwrap_or_default();"}
      - bash: {cmd: "cargo run --example missing_config", exit: 0, output: "loaded config (defaults applied)\nOK"}
    final: "Falls back to defaults instead of panicking on a missing file. [[fixed|Fixed]]."
    labels:
      fixed: {label: supported}
