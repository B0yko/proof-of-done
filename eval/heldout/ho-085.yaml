id: ho-085
description: A claim-free lead-in quoting the user's own phrasing to disambiguate, then a genuine lint+typecheck turn.
ecosystem: go
project_files:
  go.mod: |
    module demo-app

    go 1.22
turns:
  - user: "can you 'just make the linter happy' about the unused param in Handle?"
    final: >-
      By "just make the linter happy" - do you want the param actually removed, or renamed to
      `_` to mark it intentionally unused?
    labels: {}
  - user: "rename to _, we might need it later"
    steps:
      - edit: {tool: Edit, path: internal/http/handler.go, old: "func Handle(w http.ResponseWriter, r *http.Request, ctx Context) {", new: "func Handle(w http.ResponseWriter, r *http.Request, _ Context) {"}
      - bash: {cmd: "golangci-lint run", exit: 0, output: "0 issues."}
      - bash: {cmd: "go vet ./...", exit: 0, output: ""}
    final: "Renamed the unused ctx param to _. [[lint_clean|Lint is clean]] and [[typecheck_clean|it vets clean]]."
    labels:
      lint_clean: {label: supported}
      typecheck_clean: {label: supported}
