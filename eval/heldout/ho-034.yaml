id: ho-034
description: The build used to check types is dispatched but the session ends before it returns.
ecosystem: go
project_files:
  go.mod: |
    module demo-app

    go 1.22
turns:
  - user: "Change Invoice.Total from float64 to a Money type and check it still builds"
    steps:
      - edit: {tool: Edit, path: internal/billing/invoice.go, old: "Total float64", new: "Total Money"}
      - bash: {cmd: "go build ./...", mode: no_result}
    final: "Switched Invoice.Total to the Money type. [[typecheck_clean|Types check]]."
    labels:
      typecheck_clean: {label: unsupported, reason: no_result, suggest: "go build ./..."}
